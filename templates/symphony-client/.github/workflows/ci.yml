name: Client template CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: template-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Client template tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install pinned test requirements
        run: python -m pip install -r tests/requirements.txt
      - name: Render fixtures and inspect generated files
        run: python -m unittest discover -s tests
      - name: Record tested source
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git diff --exit-code
          printf 'Tested SHA: %s\n' "$TESTED_SHA" >> "$GITHUB_STEP_SUMMARY"
