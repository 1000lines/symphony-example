name: Cadence Review Handoff

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Cadence ingress run
        required: true
        type: string
      pr_number:
        description: Candidate PR number (verified against the source run)
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  SYMPHONY_BOT_USER: ${{ vars.SYMPHONY_BOT_USER || 'example-symphony-bot' }}
  CADENCE_REVIEWER: ${{ vars.CADENCE_REVIEWER || 'example-cadence-bot' }}
  SYMPHONY_REPOSITORY_OWNER: ${{ vars.SYMPHONY_REPOSITORY_OWNER || github.repository_owner }}

jobs:
  review-handoff:
    name: Route Cadence review handoff
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: cadence-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cadence-review-handoff-${{ github.repository }}-${{ inputs.pr_number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Resolve current forwarded event
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/workflows/scripts/cadence-forwarded-event.mjs

      - name: Mint existing Cadence App token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.CADENCE_APP_ID }}
          private-key: ${{ secrets.CADENCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-metadata: read
          permission-pull-requests: write

      - name: Route linked Linear issue or human review request
        env:
          LINEAR_API_TOKEN: ${{ secrets.CADENCE_LINEAR_API_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/cadence-linear-rework.mjs
