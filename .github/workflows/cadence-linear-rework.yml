name: Cadence Review Handoff

on:
  pull_request_review:
    types: [submitted, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read

env:
  SYMPHONY_BOT_USER: ${{ vars.SYMPHONY_BOT_USER || 'example-symphony-bot' }}
  CADENCE_REVIEWER: ${{ vars.CADENCE_REVIEWER || 'example-cadence-bot' }}
  SYMPHONY_REPOSITORY_OWNER: ${{ vars.SYMPHONY_REPOSITORY_OWNER || github.repository_owner }}

jobs:
  review-handoff:
    name: Route Cadence review handoff
    if: >-
      ${{
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.issue.state == 'open' &&
          github.event.issue.user.login == (vars.SYMPHONY_BOT_USER || 'example-symphony-bot') &&
          contains(github.event.issue.labels.*.name, 'symphony') &&
          github.actor != (vars.CADENCE_REVIEWER || 'example-cadence-bot') &&
          github.actor != (vars.SYMPHONY_BOT_USER || 'example-symphony-bot') &&
          github.actor != 'claude[bot]' &&
          github.actor != 'dependabot[bot]' &&
          !endsWith(github.actor, '[bot]')
        ) || (
          github.event_name == 'pull_request_review' &&
          github.event.pull_request.state == 'open' &&
          github.event.pull_request.user.login == (vars.SYMPHONY_BOT_USER || 'example-symphony-bot') &&
          contains(github.event.pull_request.labels.*.name, 'symphony') &&
          (
            github.actor == (vars.CADENCE_REVIEWER || 'example-cadence-bot') ||
            (
              github.actor != (vars.SYMPHONY_BOT_USER || 'example-symphony-bot') &&
              github.actor != 'claude[bot]' &&
              github.actor != 'dependabot[bot]' &&
              !endsWith(github.actor, '[bot]') &&
              github.event.review.state != 'approved'
            )
          )
        )
      }}
    environment: cadence-controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint existing Cadence App token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ vars.CADENCE_APP_ID }}
          private-key: ${{ secrets.CADENCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-metadata: read
          permission-pull-requests: write

      - name: Route linked Linear issue or human review request
        env:
          LINEAR_API_TOKEN: ${{ secrets.CADENCE_LINEAR_API_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node scripts/cadence-linear-rework.mjs
