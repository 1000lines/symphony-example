name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/symphony-build.yml
    with:
      tooling-directory: .
      tested-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  lint:
    uses: ./.github/workflows/symphony-lint.yml
    with:
      tooling-directory: .
      tested-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  test:
    uses: ./.github/workflows/symphony-test.yml
    with:
      tooling-directory: .
      tested-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  markdown:
    name: Changed Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head and comparison history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up tooling Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select tooling npm version
        run: npm install --global npm@11.13.0
      - name: Install locked tooling dependencies
        run: npm ci
      - name: Check changed Markdown with locked Prettier
        shell: bash
        env:
          TESTED_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const head = git('rev-parse', 'HEAD');
          if (head !== process.env.TESTED_REF) throw new Error('Checkout does not match tested-ref');
          const available = ref => {
            try { git('cat-file', '-e', `${ref}^{commit}`); return true; }
            catch { return false; }
          };
          let base = process.env.BASE_REF;
          if (process.env.GITHUB_EVENT_NAME === 'pull_request') {
            // A PR is the change since its merge base, tested at its exact head.
            base = git('merge-base', base, head);
          } else if (!base || /^0+$/.test(base)) {
            // New branch/tag: compare with the default branch when it exists.
            const defaultRef = `refs/remotes/origin/${process.env.DEFAULT_BRANCH}`;
            base = available(defaultRef) ? git('merge-base', defaultRef, head) : '';
          } else if (!available(base)) {
            // A force push may make the old commit unreachable. Check all Markdown.
            base = '';
          }
          const args = base
            ? ['diff', '--name-only', '--diff-filter=ACMR', '-z', base, head, '--']
            : ['ls-files', '-z'];
          const files = execFileSync('git', args, { encoding: 'utf8' })
            .split('\0').filter(file => /\.(md|mdx|markdown)$/i.test(file));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Tested SHA: ${head}\n\nMarkdown comparison base: ${base || 'all tracked files'}\n\nChanged Markdown files: ${files.length}\n`);
          if (files.length) {
            execFileSync('node_modules/.bin/prettier',
              ['--check', '--ignore-path', '/dev/null', '--', ...files.map(file => `./${file}`)],
              { stdio: 'inherit' });
          } else {
            console.log('No changed Markdown files; comparison completed successfully.');
          }
          NODE

  required:
    name: CI Required
    if: ${{ always() }}
    needs: [build, lint, test, markdown]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record and require every child result
        env:
          CHILD_RESULTS: ${{ toJSON(needs) }}
          TESTED_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const children = JSON.parse(process.env.CHILD_RESULTS);
          const expected = ['build', 'lint', 'test', 'markdown'];
          const rows = expected.map(name => [name, children[name]?.result || 'missing']);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `Tested SHA: ${process.env.TESTED_REF}`,
            `Event: ${process.env.GITHUB_EVENT_NAME}`,
            `Event base SHA: ${process.env.BASE_REF || 'none'}`,
            `Workflow: ${process.env.WORKFLOW_REF}`,
            '', '| Child | Result |', '| --- | --- |',
            ...rows.map(([name, result]) => `| ${name} | ${result} |`), ''
          ].join('\n'));
          for (const [name, result] of rows) console.log(`${name}: ${result}`);
          if (rows.some(([, result]) => result !== 'success')) process.exitCode = 1;
          NODE
