name: Cadence AI Review

# Manually dispatched review request for a group of opt-in Symphony PRs. This
# workflow is orchestration only: it resolves the requested PR set, then asks
# GitHub to request or re-request `example-cadence-bot`. The resulting
# `review_requested` event starts the single-PR review runner, so manual and
# event-driven reviews share the same visible queue state.

on:
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: "PRs to review, comma- or space-separated (e.g. 123, 456). Optional if review_label is set."
        required: false
        type: string
      review_label:
        description: "Review every open PR carrying this label. Optional if pr_numbers is set."
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: write

env:
  SYMPHONY_BOT_USER: ${{ vars.SYMPHONY_BOT_USER || 'example-symphony-bot' }}
  CADENCE_REVIEWER: ${{ vars.CADENCE_REVIEWER || 'example-cadence-bot' }}
  SYMPHONY_REPOSITORY_OWNER: ${{ vars.SYMPHONY_REPOSITORY_OWNER || github.repository_owner }}

jobs:
  resolve:
    name: Resolve PR list
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pr_numbers: ${{ steps.resolve.outputs.pr_numbers }}
      count: ${{ steps.resolve.outputs.count }}
    steps:
      - name: Resolve manual review inputs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.CADENCE_BOT_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          REVIEW_LABEL: ${{ inputs.review_label }}
        run: |
          set -euo pipefail

          raw_numbers="$(printf '%s' "${PR_NUMBERS}" | tr ',[:space:]' '\n' | sed '/^$/d')"
          if [ -z "${raw_numbers}" ] && [ -z "${REVIEW_LABEL}" ]; then
            echo "::error::Provide pr_numbers, review_label, or both."
            exit 1
          fi

          pr_file="${RUNNER_TEMP}/cadence-manual-prs.txt"
          : > "${pr_file}"

          if [ -n "${raw_numbers}" ]; then
            while IFS= read -r number; do
              if ! printf '%s' "${number}" | grep -Eq '^[1-9][0-9]*$'; then
                echo "::error::Invalid PR number: ${number}"
                exit 1
              fi
              printf '%s\n' "${number}" >> "${pr_file}"
            done <<< "${raw_numbers}"
          fi

          if [ -n "${REVIEW_LABEL}" ]; then
            if [ -z "${GH_TOKEN}" ]; then
              echo "::error::CADENCE_BOT_GITHUB_TOKEN is required when review_label is set."
              exit 1
            fi
            gh pr list \
              --state open \
              --label "${REVIEW_LABEL}" \
              --limit 1000 \
              --json number \
              --jq '.[].number' >> "${pr_file}"
          fi

          mapfile -t resolved < <(sort -n -u "${pr_file}")
          if [ "${#resolved[@]}" -eq 0 ]; then
            echo "::error::No open pull requests matched the supplied Cadence review inputs."
            exit 1
          fi

          json="$(printf '%s\n' "${resolved[@]}" | jq -R . | jq -sc .)"
          printf 'Resolved Cadence review PRs: %s\n' "$(IFS=', '; echo "${resolved[*]}")"
          printf 'pr_numbers=%s\n' "${json}" >> "${GITHUB_OUTPUT}"
          printf 'count=%s\n' "${#resolved[@]}" >> "${GITHUB_OUTPUT}"

  request-review:
    name: Request Cadence review for PR #${{ matrix.pr_number }}
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJson(needs.resolve.outputs.pr_numbers) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Request or re-request Cadence review
        env:
          GH_TOKEN: ${{ secrets.CADENCE_BOT_GITHUB_TOKEN }}
          DELETE_GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ matrix.pr_number }}
          REVIEWER_LOGIN: ${{ vars.CADENCE_REVIEWER || 'example-cadence-bot' }}
          DISMISS_APPROVALS: "true"
          DISMISS_MESSAGE: "Cadence approval is stale because a manual review request is queued; Cadence will re-review current PR state."
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::CADENCE_BOT_GITHUB_TOKEN is required to request Cadence review."
            exit 1
          fi

          if ! output="$(node .github/workflows/scripts/request-pr-reviewer.mjs 2>&1)"; then
            echo "::error::Could not guarantee a fresh Cadence review request for PR #${PR_NUMBER}: ${output}"
            exit 1
          fi

          printf '%s\n' "${output}"
